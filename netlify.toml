[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'no build step needed'"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/checkout"
  to = "/.netlify/functions/meta-checkout"
  status = 200

[dev]
  publish = "public"
  functions = "netlify/functions"
